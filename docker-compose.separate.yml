version: '3.8'

services:
  health_backend:
    build:
      context: ./health_backend
      dockerfile: Dockerfile
    container_name: health_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:80"

  health_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: health_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - health_backend
